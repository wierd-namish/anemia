services:
  - type: web
    name: anemia-ai
    env: python
    buildCommand: pip install --no-cache-dir .
    startCommand: uvicorn anemia_ai.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANEMIA_ENV
        value: production
    healthCheckPath: /api/v1/health
    plan: free
