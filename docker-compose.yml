version: '3.8'

services:
  anemia-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: anemia-ai:latest
    container_name: anemia_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANEMIA_ENV=production
      - ANEMIA_LOG_LEVEL=INFO
      - ANEMIA_API_HOST=0.0.0.0
      - ANEMIA_API_PORT=8000
      - ANEMIA_CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
