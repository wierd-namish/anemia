name: Comprehensive Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install OpenCV system libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install httpx

    - name: Download model weights
      run: python scripts/download_models.py

    - name: Run Unit Tests
      run: python -m unittest discover -s tests/unit -p "test_*.py"

    - name: Run API Tests
      run: python -m unittest discover -s tests/api -p "test_*.py"

    - name: Run Inference Tests
      run: python -m unittest discover -s tests/inference -p "test_*.py"

    - name: Run Training & Leakage Tests
      run: python -m unittest discover -s tests/training -p "test_*.py"
